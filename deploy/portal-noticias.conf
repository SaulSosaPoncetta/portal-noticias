# =====================================================================
# Nginx - Portal de Noticias
# Copiar a: /etc/nginx/sites-available/portal-noticias
# Certbot agrega solo la parte de HTTPS (puerto 443) al correrlo.
# =====================================================================

# www.ociodigital.com.ar → ociodigital.com.ar (una sola dirección para Google)
server {
    listen 80;
    listen [::]:80;
    server_name www.ociodigital.com.ar;
    return 301 https://ociodigital.com.ar$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name ociodigital.com.ar;

    root /var/www/portal-noticias/public;
    index index.php;
    charset utf-8;

    # Fotos de notas y banners (tiene que ser >= post_max_size de PHP)
    client_max_body_size 12M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión de HTML, CSS y JS
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Archivos estáticos (CSS/JS compilados, fotos de storage) con caché de 30 días
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|svg|ico|woff2?)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60;
    }

    # Bloquea .env, .git y cualquier archivo oculto
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
